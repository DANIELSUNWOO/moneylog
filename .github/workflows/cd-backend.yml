name: CD - Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest와 커밋 sha, 두 개의 태그를 동시에 붙인다.
      # sha 태그가 있어야 나중에 "이 시점으로 되돌려라"는 롤백 대상이 생긴다.
      - name: 빌드 + 푸시
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/danielsunwoo/moneylog-backend:latest
            ghcr.io/danielsunwoo/moneylog-backend:${{ github.sha }}
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: AWS 자격 증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: EC2에서 재배포 (SSM)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0ee7f6a4eade2fdbb" \
            --document-name "AWS-RunShellScript" \
            --comment "CD - Backend deploy" \
            --parameters '{"commands":["cd /home/ec2-user/moneylog","docker compose -f docker-compose.yml pull backend","docker compose -f docker-compose.yml up -d backend"]}' \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ee7f6a4eade2fdbb" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ee7f6a4eade2fdbb"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0ee7f6a4eade2fdbb" \
            --query "Status" --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: 위 StandardErrorContent를 확인하세요."
            exit 1
          fi