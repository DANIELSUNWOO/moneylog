name: CI - Terraform

# 인프라 코드도 애플리케이션 코드와 같은 기준으로 검증한다.
# apply 는 하지 않는다 — 실제 인프라를 건드리는 일은 사람이 로컬에서 plan 을 본 뒤 결정한다.
# 여기서 잡으려는 것은 "형식이 어긋났거나 문법이 깨진 코드가 main 에 들어가는 것"뿐이다.

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/ci-terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Terraform 설치
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      # 포맷 검사. -check 는 고치지 않고 어긋난 파일이 있으면 실패시킨다.
      - name: 포맷 검사
        run: terraform fmt -check -recursive

      # -backend=false 로 초기화한다.
      # state 를 읽을 이유가 없고, 그러려면 AWS 자격증명이 필요해진다.
      # 문법 검사에는 프로바이더 스키마만 있으면 된다.
      - name: 초기화 (백엔드 없이)
        run: terraform init -backend=false

      - name: 문법 검사
        run: terraform validate