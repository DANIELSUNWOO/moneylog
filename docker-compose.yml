# 운영 기준 구성. EC2에서는 이 파일 하나만으로 뜬다.
# 로컬에서는 docker-compose.override.yml 이 자동으로 병합되어 빌드·포트가 추가된다.
#
#   로컬 : docker compose up -d --build      (base + override)
#   운영 : docker compose -f docker-compose.yml up -d   (base만)

services:
  mysql:
    image: mysql:8.0
    container_name: moneylog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-moneylog}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [moneylog-net]
    # ports 없음 — DB는 도커 네트워크 안에서만 접근한다.
    # 운영에서 3306을 호스트에 노출하는 것은 곧 인터넷 노출이다.

  backend:
    image: ghcr.io/danielsunwoo/moneylog-backend:${IMAGE_TAG:-latest}
    container_name: moneylog-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 호스트 이름이 localhost가 아니라 서비스 이름 'mysql' 이다.
      # 같은 도커 네트워크 안에서는 서비스 이름이 DNS로 해석된다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-moneylog}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://13-125-116-52.sslip.io}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [moneylog-net]
    # ports 없음 — 외부에서 8080에 직접 들어올 이유가 없다.
    # 프론트의 nginx가 /api 를 이 컨테이너로 프록시한다.

  frontend:
    image: ghcr.io/danielsunwoo/moneylog-frontend:${IMAGE_TAG:-latest}
    container_name: moneylog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"          # 인터넷에 열리는 유일한 문
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks: [moneylog-net]

volumes:
  mysql-data:

networks:
  moneylog-net:
