server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅. React Router가 /transactions, /statistics 같은 경로를 클라이언트에서 처리하므로
    # 서버에는 그 파일이 없다. 없는 경로는 전부 index.html로 돌려야 새로고침해도 404가 안 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 빌드 산출물은 내용이 바뀌면 파일명도 바뀌므로 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api 요청을 백엔드 컨테이너로 넘긴다.
    # 브라우저 입장에서는 같은 오리진이라 CORS가 아예 발생하지 않는다.
    # (docker compose 네트워크 안에서 'backend'가 서비스 이름으로 해석된다)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI도 같은 도메인에서 열리게 프록시한다(제출물 3번).
    location /swagger-ui/   { proxy_pass http://backend:8080/swagger-ui/; }
    location /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; }
    location /v3/api-docs   { proxy_pass http://backend:8080/v3/api-docs; }
    location /v3/api-docs/  { proxy_pass http://backend:8080/v3/api-docs/; }
}
