# 로컬 개발 전용 nginx 설정.
#
# 운영 설정(frontend/nginx.conf)은 HTTPS와 Let's Encrypt 인증서를 전제하는데,
# 그 인증서는 EC2에만 있다. 개발 PC에는 없으므로 nginx가 기동조차 하지 못하고
# 컨테이너가 무한 재시작에 빠진다.
#
# 그래서 로컬에서는 이 파일을 컨테이너의 설정 위에 덮어써서 평문 HTTP로만 서비스한다.
# 운영 설정 파일은 손대지 않는다 — "base=운영, override=로컬" 원칙 그대로다.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅. React Router가 처리하는 경로는 서버에 파일이 없으므로 index.html로 넘긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 운영의 nginx와 같은 역할. 프론트와 API가 같은 오리진이 되어 로컬에서도 CORS가 발생하지 않는다.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui/     { proxy_pass http://backend:8080/swagger-ui/; }
    location /swagger-ui.html { proxy_pass http://backend:8080/swagger-ui.html; }
    location /v3/api-docs     { proxy_pass http://backend:8080/v3/api-docs; }
    location /v3/api-docs/    { proxy_pass http://backend:8080/v3/api-docs/; }
}
